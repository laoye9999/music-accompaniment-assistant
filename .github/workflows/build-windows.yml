name: 打包 Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install demucs sounddevice numpy pyinstaller

      - name: 打包 exe
        working-directory: windows
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name "MusicAssistant" `
            --collect-all torch `
            --collect-all torchaudio `
            --collect-all demucs `
            --collect-all dora_search `
            --collect-all lameenc `
            --collect-all julius `
            --collect-all einops `
            --collect-all openunmix `
            --collect-all treetable `
            app.py

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: 音乐伴奏助力-Windows-exe
          path: windows/dist/*.exe
